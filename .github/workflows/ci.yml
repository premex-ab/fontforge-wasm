name: Build and verify WASM
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          outputs: type=local,dest=artifacts
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: npm ci
      - run: node build/assemble.mjs
      - run: npm run build:scripting
      - run: node --test test/scripting/api.test.mjs test/scripting/quota.test.mjs
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install fonttools==4.59.0 brotli==1.2.0
          .venv/bin/python test/make-fixtures.py
          npm test
          .venv/bin/python test/verify-output.py
          .venv/bin/python test/verify-formats.py
      - run: |
          npm ci
          npx playwright install --with-deps chromium webkit
          npm run test:browser
          BROWSER_CHANNEL=chromium node test/scripting/api-browser.mjs
          node test/pages-cache.mjs
          BROWSER_CHANNEL=chromium node test/playground.mjs
      - run: node build/release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: fontforge-wasm-alpha
          path: artifacts/release/
          if-no-files-found: error

      - name: Assemble GitHub Pages demo
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node build/pages.mjs
      - name: Upload GitHub Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  ci:
    name: CI
    if: always()
    needs: wasm
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful build and tests
        env:
          BUILD_RESULT: ${{ needs.wasm.result }}
        run: test "$BUILD_RESULT" = success
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: wasm
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
