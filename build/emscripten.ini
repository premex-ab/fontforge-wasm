[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
strip = 'emstrip'
pkg-config = 'pkg-config'

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
c_args = ['-O2', '-Wno-error=incompatible-function-pointer-types', '-Wno-error=incompatible-pointer-types']
cpp_args = ['-O2']
c_link_args = ['/work/platform.o']
cpp_link_args = ['/work/platform.o']
